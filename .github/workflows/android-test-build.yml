name: Android test build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "test/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remote-server/package-lock.json
      - name: Test relay and recovery scenarios
        working-directory: remote-server
        run: npm ci && npm test
      - name: Test and build isolated candidate
        run: ./gradlew testCandidateUnitTest lintCandidate assembleCandidate --no-daemon
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v7
        with:
          name: play-keeper-unsigned-candidate
          path: app/build/outputs/apk/candidate/*.apk
          if-no-files-found: error
