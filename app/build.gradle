plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.sgplaykeeper'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.local.sgplaykeeper'
        minSdk 26
        targetSdk 35
        versionCode 50
        versionName '2.0.3'
        buildConfigField 'String', 'REMOTE_PRESET_NAME', '""'
        buildConfigField 'String', 'REMOTE_PRESET_ENDPOINT', '""'
    }

    signingConfigs {
        preservedDebug {
            def repositoryKey = rootProject.file('signing/debug.keystore')
            def userKey = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def availableKey = repositoryKey.exists() ? repositoryKey : userKey.exists() ? userKey : null
            if (availableKey != null) storeFile availableKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test.v190'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'Play Keeper 2.0 测试'
        }
        release {
            // v1.9 is the user-approved parallel-install line. Keep this ID so the
            // formal build upgrades the already-tested v1.9 app without touching v1.8.x.
            applicationIdSuffix '.test.v190'
            if (signingConfigs.preservedDebug.storeFile != null) {
                signingConfig signingConfigs.preservedDebug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        candidate {
            // Candidate builds use a separate Android identity so they can be installed
            // beside the formal v1.9+ line.  Each installation therefore retains its
            // own remote endpoint, device token, WebView sessions and account mapping.
            applicationIdSuffix '.candidate'
            versionNameSuffix '-rc2.2'
            resValue 'string', 'app_name', 'Play Keeper 候选版'
            buildConfigField 'String', 'REMOTE_PRESET_NAME', '"候选版测试服务器"'
            buildConfigField 'String', 'REMOTE_PRESET_ENDPOINT', '"wss://keeper-test.19990920.xyz/device"'
            if (signingConfigs.preservedDebug.storeFile != null) {
                signingConfig signingConfigs.preservedDebug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release']
        }
        macParallel {
            // Stable Mac development line. It can coexist with the Windows-signed
            // v1.9+ release and keeps its own WebView cookies/account sessions.
            applicationIdSuffix '.macparallel'
            versionNameSuffix '-mac'
            resValue 'string', 'app_name', 'Play Keeper Mac 平行版'
            if (signingConfigs.preservedDebug.storeFile != null) {
                signingConfig signingConfigs.preservedDebug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().withBuildType('candidate')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(49)
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
