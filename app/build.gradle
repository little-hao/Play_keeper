plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.sgplaykeeper'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.local.sgplaykeeper'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '1.10.3'
    }

    signingConfigs {
        preservedDebug {
            def repositoryKey = rootProject.file('signing/debug.keystore')
            def userKey = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def availableKey = repositoryKey.exists() ? repositoryKey : userKey.exists() ? userKey : null
            if (availableKey != null) storeFile availableKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test.v190'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'Play Keeper 1.10.3 测试'
        }
        release {
            // v1.9 is the user-approved parallel-install line. Keep this ID so the
            // formal build upgrades the already-tested v1.9 app without touching v1.8.x.
            applicationIdSuffix '.test.v190'
            if (signingConfigs.preservedDebug.storeFile != null) {
                signingConfig signingConfigs.preservedDebug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
