<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Play Keeper 远程控制</title>
  <link rel="stylesheet" href="/styles.css?v=1.2.0">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">PLAY KEEPER</p>
        <h1>远程控制台</h1>
      </div>
      <span id="connectionState" class="state offline">未连接</span>
    </header>

    <section id="loginPanel" class="panel login">
      <h2>连接服务器</h2>
      <p>输入部署服务时设置的管理密钥。密钥只保留在本页会话中，关闭页面后自动清除。</p>
      <label for="adminToken">管理密钥</label>
      <div class="login-row">
        <input id="adminToken" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN">
        <button id="connectButton" class="primary">连接</button>
      </div>
      <p id="loginError" class="error" role="alert"></p>
    </section>

    <section id="dashboard" class="hidden" aria-live="polite">
      <div class="summary-row">
        <div><span id="deviceCount">0</span><small>在线设备</small></div>
        <button id="refreshStatus" class="secondary">刷新状态</button>
        <button id="disconnectButton" class="secondary">断开</button>
      </div>
      <div id="deviceList" class="device-list"></div>
      <section class="panel log-panel">
        <div class="section-title"><h2>操作记录</h2><button id="clearLog" class="text-button">清空</button></div>
        <ol id="eventLog" class="event-log"></ol>
      </section>
    </section>
  </main>

  <template id="deviceTemplate">
    <article class="panel device-card">
      <div class="device-heading">
        <div><span class="online-dot"></span><strong class="device-id"></strong><small class="device-model"></small></div>
        <span class="last-update"></span>
      </div>
      <div class="metrics">
        <div><small>电量</small><strong class="battery-level">--</strong></div>
        <div><small>温度</small><strong class="battery-temp">--</strong></div>
        <div><small>功率</small><strong class="battery-power">--</strong></div>
        <div><small>当前账号</small><strong class="active-account">--</strong></div>
      </div>
      <div class="account-tabs" role="group" aria-label="账号切换"></div>
      <div class="button-grid">
        <button data-command="reload_account">刷新</button>
        <button data-command="open_home">首页</button>
        <button data-command="set_orientation" data-orientation="landscape">横屏</button>
        <button data-command="set_orientation" data-orientation="portrait">竖屏</button>
        <button data-command="enter_black_screen">黑屏</button>
        <button data-command="exit_black_screen">退出黑屏</button>
      </div>
      <section class="automation-panel">
        <div class="section-title">
          <div><strong>一键脚本</strong><small class="automation-status">尚未运行</small></div>
        </div>
        <div class="automation-grid">
          <label class="toggle-row"><input class="auction-enabled" type="checkbox"> 定时拍卖（保留1个）</label>
          <label class="toggle-row"><input class="store-sell-enabled" type="checkbox"> 定时卖出金币券</label>
          <label class="span-2">拍卖道具（逗号分隔，可修改）<input class="auction-items" type="text" value="进化宝石,曙光印记"></label>
          <label>执行间隔（小时）<input class="auction-hours" type="number" min="1" max="168" value="12"></label>
          <label>指定买家<input class="auction-buyer" type="text" maxlength="30" value="hao"></label>
          <label>商店匹配<select class="store-sell-item"><option value="金币券">*金币券*（1W/5W/10W）</option></select></label>
          <label class="toggle-row"><input class="temple-enabled" type="checkbox"> 圣兽云殿守护（1h）</label>
        </div>
        <div class="automation-actions">
          <button class="save-automation primary">保存</button>
          <button class="run-auction secondary">立即拍卖</button>
          <button class="run-store-sell secondary">立即卖金币券</button>
          <button class="run-temple secondary">立即恢复挂机</button>
        </div>
        <p class="automation-help">脚本会自动切横屏进入城镇，完成后返回竖屏挂机辅助；每30分钟检查战斗统计。</p>
      </section>
      <section class="preview-panel">
        <div class="preview-heading">
          <div><strong>手机页面</strong><small class="preview-status">按需加载，不在服务器保存</small></div>
          <div class="preview-actions">
            <label>画质
              <select class="preview-resolution" aria-label="预览画质">
                <option value="720">流畅 720</option>
                <option value="1280">高清 1280</option>
                <option value="2560">超清 2560</option>
              </select>
            </label>
            <button class="preview-start primary">加载/刷新</button>
            <button class="preview-stop secondary">停止</button>
          </div>
        </div>
        <div class="preview-stage">
          <p class="preview-placeholder">点击“加载画面”查看当前账号页面</p>
          <img class="preview-image hidden" alt="手机当前网页预览，可直接点击操作">
        </div>
        <p class="preview-help">画面最高每秒更新一次。点击画面会在当前 WebView 的对应位置执行一次单击。</p>
      </section>
      <p class="device-note"></p>
    </article>
  </template>
  <div id="selectOverlay" class="select-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="selectTitle">
    <section class="select-dialog panel">
      <div class="section-title">
        <div><p class="eyebrow">手机页面选择项</p><h2 id="selectTitle">请选择</h2></div>
        <button id="closeSelect" class="secondary">取消</button>
      </div>
      <p id="selectAccount" class="select-account"></p>
      <div id="selectOptions" class="select-options" role="radiogroup"></div>
    </section>
  </div>
  <script type="module" src="/app.js?v=1.2.0"></script>
</body>
</html>
